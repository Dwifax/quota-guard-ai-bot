from fastapi import FastAPI

from app.storage import init_db, list_cooldowns

app = FastAPI(title="QuotaGuard AI Bot")


@app.on_event("startup")
def startup() -> None:
    init_db()


@app.get("/")
def root():
    return {"name": "QuotaGuard AI Bot", "status": "ok"}


@app.get("/status")
def status():
    return {"cooldowns": list_cooldowns()}
